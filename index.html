
<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2/4 Musiqa Vaqti - Ali Bilan</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            padding: 10px;
        }
        .container {
            background: rgba(255, 255, 255, 0.96);
            padding: 15px 20px;
            border-radius: 20px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.12);
            text-align: center;
            max-width: 480px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }
        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            padding: 0 5px;
        }
        .title {
            font-size: 18px;
            font-weight: bold;
            color: #2c3e50;
        }
        .score-board {
            font-size: 16px;
            font-weight: bold;
            color: #d63384;
            background: #ffe6f2;
            padding: 4px 12px;
            border-radius: 12px;
        }
        .ali-box {
            position: relative;
            width: 100%;
            height: 180px;
            background-color: #000;
            border-radius: 12px;
            overflow: hidden;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .instruction {
            font-size: 14px;
            color: #555;
        }
        .drop-zone {
            display: flex;
            justify-content: center;
            gap: 12px;
            background: url('box.png') no-repeat center/contain;
            padding: 10px;
            min-height: 90px;
            align-items: center;
        }
        .slot {
            width: 75px;
            height: 75px;
            border: 2px dashed #0d6efd;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: rgba(255,255,255,0.85);
        }
        .slot img, .note img {
            width: 60px;
            height: 60px;
            object-fit: contain;
        }
        .notes-palette {
            display: flex;
            justify-content: center;
            gap: 20px;
        }
        .note {
            width: 70px;
            height: 70px;
            cursor: grab;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f8f9fa;
            border-radius: 10px;
            border: 1px solid #dee2e6;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .btn-group {
            display: flex;
            gap: 10px;
        }
        .btn {
            background-color: #198754;
            color: white;
            border: none;
            padding: 8px 20px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn:hover {
            opacity: 0.9;
        }
        .btn-reset {
            background-color: #dc3545;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-row">
        <div class="title">2/4 Musiqa Vaqti</div>
        <div class="score-board">Ball: <span id="score">0</span></div>
    </div>

    <div class="ali-box">
        <video id="aliVideo" autoplay playsinline controls>
            <source id="videoSource" src="v1.mp4" type="video/mp4">
        </video>
    </div>

    <p class="instruction">Notalarni kataklarga sudrab o'tkazing va taktni to'ldiring!</p>

    <div class="drop-zone">
        <div class="slot" id="slot1" ondrop="drop(event)" ondragover="allowDrop(event)"></div>
        <div class="slot" id="slot2" ondrop="drop(event)" ondragover="allowDrop(event)"></div>
    </div>

    <div class="notes-palette">
        <div class="note" draggable="true" ondragstart="drag(event)" id="q1">
            <img src="quarter.png" id="img_q1">
        </div>
        <div class="note" draggable="true" ondragstart="drag(event)" id="e1">
            <img src="eighths.png" id="img_e1">
        </div>
    </div>

    <div class="btn-group">
        <button class="btn" onclick="checkAnswer()">Tekshirish</button>
        <button class="btn btn-reset" onclick="resetGame()">Qaytadan</button>
    </div>
</div>

<script>
    let score = 0;
    let currentVideo = 'v1';
    const video = document.getElementById('aliVideo');
    const source = document.getElementById('videoSource');

    // Видео тугагандаги автоматик занжир (логика)
    video.onended = function() {
        if (currentVideo === 'v1') {
            // 1-видео (вазифа) тугагач -> 2-видео (йўриқнома) бошланади
            playAliVideo('v2.mp4', 'v2');
        } else if (currentVideo === 'v3') {
            // 3-видео (хато / бироз ўйлаб кўр) тугагач -> яна 2-видеога қайтади
            playAliVideo('v2.mp4', 'v2');
        }
    };

    function playAliVideo(fileName, videoId) {
        currentVideo = videoId;
        source.src = fileName;
        video.load();
        video.play().catch(e => console.log("Auto-play:", e));
    }

    function allowDrop(ev) { 
        ev.preventDefault(); 
    }

    function drag(ev) { 
        ev.dataTransfer.setData("text", ev.target.id); 
    }

    function drop(ev) {
        ev.preventDefault();
        var data = ev.dataTransfer.getData("text");
        var draggedElement = document.getElementById(data);
        
        var targetSlot = ev.target;
        if (!targetSlot.classList.contains('slot')) {
            targetSlot = targetSlot.closest('.slot');
        }

        if (targetSlot && targetSlot.children.length === 0) {
            let clone = draggedElement.cloneNode(true);
            clone.id = data + "_clone_" + Math.random();
            targetSlot.appendChild(clone);
        }
    }

    function checkAnswer() {
        let slot1 = document.getElementById('slot1');
        let slot2 = document.getElementById('slot2');

        if (slot1.children.length > 0 && slot2.children.length > 0) {
            score += 10;
            document.getElementById('score').innerText = score;
            
            // Тўғри бўлса, 2-видеони қайта ўйнатади ва янги раундга ўтади
            playAliVideo('v2.mp4', 'v2_success');
            setTimeout(() => {
                resetSlots();
            }, 2000);
        } else {
            // Хато ёки тўлиқ бўлмаса -> 3-видео (бироз ўйлаб кўр)
            playAliVideo('v3.mp4', 'v3');
        }
    }

    function resetSlots() {
        document.getElementById('slot1').innerHTML = '';
        document.getElementById('slot2').innerHTML = '';
    }

    function resetGame() {
        resetSlots();
        playAliVideo('v1.mp4', 'v1');
    }
</script>

</body>
</html>
