
<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2/4 Мусиқа Вақти - Али Билан</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: rgba(255, 255, 255, 0.95);
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 500px;
            width: 100%;
        }
        .ali-box {
            position: relative;
            width: 100%;
            height: 250px;
            background-color: #000;
            border-radius: 15px;
            overflow: hidden;
            margin-bottom: 15px;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .score-board {
            font-size: 18px;
            font-weight: bold;
            color: #d63384;
            margin-bottom: 10px;
        }
        .drop-zone {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 20px 0;
            background: url('box.png') no-repeat center/contain;
            padding: 20px;
            min-height: 120px;
        }
        .slot {
            width: 100px;
            height: 100px;
            border: 2px dashed #0d6efd;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: rgba(255,255,255,0.7);
        }
        .notes-palette {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 15px;
        }
        .note {
            width: 80px;
            height: 80px;
            cursor: grab;
        }
        .note img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        .btn {
            background-color: #198754;
            color: white;
            border: none;
            padding: 10px 25px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 15px;
        }
        .btn-reset {
            background-color: #dc3545;
            margin-left: 10px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="score-board">Балл: <span id="score">0</span></div>
    
    <div class="ali-box">
        <video id="aliVideo" autoplay playsinline controls>
            <source id="videoSource" src="v1.mp4" type="video/mp4">
        </video>
    </div>

    <h2>2/4 Мусиқий Ўлчов Ўйини</h2>
    <p>Ноталарни судраб ўтказинг ва тактни тўлдиринг!</p>

    <div class="drop-zone">
        <div class="slot" id="slot1" ondrop="drop(event)" ondragover="allowDrop(event)"></div>
        <div class="slot" id="slot2" ondrop="drop(event)" ondragover="allowDrop(event)"></div>
    </div>

    <div class="notes-palette">
        <div class="note" draggable="true" ondragstart="drag(event)" id="q1">
            <img src="quarter.png" id="img_q1" data-val="1">
        </div>
        <div class="note" draggable="true" ondragstart="drag(event)" id="e1">
            <img src="eighths.png" id="img_e1" data-val="1">
        </div>
    </div>

    <div>
        <button class="btn" onclick="checkAnswer()">Текшириш</button>
        <button class="btn btn-reset" onclick="resetGame()">Қайтадан</button>
    </div>
</div>

<script>
    let score = 0;

    function playAliVideo(fileName) {
        let video = document.getElementById('aliVideo');
        let source = document.getElementById('videoSource');
        source.src = fileName;
        video.load();
        video.play().catch(e => console.log("Автоижро чеклови:", e));
    }

    function allowDrop(ev) { 
        ev.preventDefault(); 
    }

    function drag(ev) { 
        ev.dataTransfer.setData("text", ev.target.id); 
    }

    function drop(ev) {
        ev.preventDefault();
        var data = ev.dataTransfer.getData("text");
        var draggedElement = document.getElementById(data);
        
        var targetSlot = ev.target;
        if (!targetSlot.classList.contains('slot')) {
            targetSlot = targetSlot.closest('.slot');
        }

        if (targetSlot && targetSlot.children.length === 0) {
            let clone = draggedElement.cloneNode(true);
            clone.id = data + "_clone_" + Math.random();
            targetSlot.appendChild(clone);
        }
    }

    function checkAnswer() {
        let slot1 = document.getElementById('slot1');
        let slot2 = document.getElementById('slot2');

        // Иккала катақда ҳам нота бор-yo'qligini текширамиз
        if (slot1.children.length > 0 && slot2.children.length > 0) {
            score += 10;
            document.getElementById('score').innerText = score;
            playAliVideo('v2.mp4'); // Тўғри жавоб видеоси
        } else {
            playAliVideo('v3.mp4'); // Хато / тўлиқ эмас видеоси
        }
    }

    function resetGame() {
        document.getElementById('slot1').innerHTML = '';
        document.getElementById('slot2').innerHTML = '';
        playAliVideo('v1.mp4');
    }
</script>

</body>
</html>
