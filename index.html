
<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2/4 Ritm Пазли - Али Билaн</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #a8edda 0%, #fed6e3 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .game-container {
            background: rgba(255, 255, 255, 0.95);
            padding: 30px;
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.15);
            max-width: 900px;
            width: 100%;
            text-align: center;
        }

        h1 {
            color: #2c3e50;
            margin-bottom: 20px;
            font-size: 28px;
        }

        .main-content {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
            align-items: center;
        }

        .video-box {
            width: 100%;
            max-width: 420px;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            background: #000;
        }

        video {
            width: 100%;
            display: block;
        }

        .interactive-area {
            flex: 1;
            min-width: 300px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        /* Такт идишлари (Drop slots) */
        .measure-container {
            display: flex;
            gap: 15px;
            background: #f8f9fa;
            padding: 20px;
            border-radius: 16px;
            border: 3px dashed #bdc3c7;
        }

        .slot {
            width: 100px;
            height: 100px;
            border: 2px dashed #3498db;
            border-radius: 12px;
            background: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.3s ease;
        }

        .slot.hovered {
            background: #e8f4f8;
            border-color: #2ecc71;
            transform: scale(1.05);
        }

        .slot img {
            max-width: 80%;
            max-height: 80%;
            object-fit: contain;
        }

        /* Ноталар палитраси */
        .notes-palette {
            display: flex;
            gap: 15px;
            justify-content: center;
            padding: 15px;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            flex-wrap: wrap;
        }

        .note {
            width: 75px;
            height: 75px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            cursor: grab;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #fff;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .note:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .note img {
            max-width: 80%;
            max-height: 80%;
            object-fit: contain;
            pointer-events: none;
        }

        .btn-check {
            background: linear-gradient(135deg, #2ecc71 0%, #27ae60 100%);
            color: white;
            border: none;
            padding: 14px 32px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(46, 204, 113, 0.3);
            transition: all 0.3s ease;
        }

        .btn-check:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(46, 204, 113, 0.4);
        }

        .btn-check:active {
            transform: translateY(1px);
        }
    </style>
</head>
<body>

<div class="game-container">
    <h1>🎶 2/4 Мусиқа Вақти - Али Билaн</h1>

    <div class="main-content">
        <!-- Видео ойнаси -->
        <div class="video-box">
            <video id="aliVideo" autoplay playsinline>
                <source src="v1.mp4" type="video/mp4">
                Браузерингиз видеони қўллаб-қувватламайди.
            </video>
        </div>

        <div class="interactive-area">
            <!-- Тўлдириладиган такт катаклари -->
            <div class="measure-container">
                <div class="slot" ondrop="drop(event)" ondragover="allowDrop(event)" id="slot1"></div>
                <div class="slot" ondrop="drop(event)" ondragover="allowDrop(event)" id="slot2"></div>
            </div>

            <!-- Ноталар палитраси (Тўғри ва чалғитувчи ноталар) -->
            <div class="notes-palette">
                <!-- Тўғри ноталар -->
                <div class="note" draggable="true" ondragstart="drag(event)" id="correct_1">
                    <img src="quarter.png" id="img_c1" data-correct="true">
                </div>
                <div class="note" draggable="true" ondragstart="drag(event)" id="correct_2">
                    <img src="eighths.png" id="img_c2" data-correct="true">
                </div>

                <!-- Чалғитувчи нота ва белгилар -->
                <div class="note" draggable="true" ondragstart="drag(event)" id="wrong_1">
                    <img src="clef.png" id="img_w1" data-correct="false">
                </div>
                <div class="note" draggable="true" ondragstart="drag(event)" id="wrong_2">
                    <img src="eighth_single.png" id="img_w2" data-correct="false">
                </div>
            </div>

            <!-- Текшириш тугмаси -->
            <button class="btn-check" onclick="checkAnswer()">Текшириш</button>
        </div>
    </div>
</div>

<script>
    const aliVideo = document.getElementById('aliVideo');

    function allowDrop(ev) {
        ev.preventDefault();
        ev.currentTarget.classList.add('hovered');
    }

    function drag(ev) {
        const img = ev.target.querySelector('img');
        ev.dataTransfer.setData("text", img.id);
    }

    function drop(ev) {
        ev.preventDefault();
        ev.currentTarget.classList.remove('hovered');
        
        const data = ev.dataTransfer.getData("text");
        const draggedImg = document.getElementById(data);

        // Агар катакда олдин расм бўлса, янгисига алмаштиради
        ev.currentTarget.innerHTML = '';
        const clonedImg = draggedImg.cloneNode(true);
        ev.currentTarget.appendChild(clonedImg);
    }

    function checkAnswer() {
        const slot1 = document.getElementById('slot1').querySelector('img');
        const slot2 = document.getElementById('slot2').querySelector('img');

        if (!slot1 || !slot2) {
            alert("Илтимос, иккала катакни ҳам ноталар билан тўлдиринг!");
            return;
        }

        const isSlot1Correct = slot1.getAttribute('data-correct') === 'true';
        const isSlot2Correct = slot2.getAttribute('data-correct') === 'true';

        if (isSlot1Correct && isSlot2Correct) {
            // Тўғри жавоб: Баракалла! (v3.mp4)
            aliVideo.src = 'v3.mp4';
            aliVideo.play();
        } else {
            // Хато жавоб: Кайтадан уриниб кур (v2.mp4)
            aliVideo.src = 'v2.mp4';
            aliVideo.play();
        }
    }
</script>

</body>
</html>
