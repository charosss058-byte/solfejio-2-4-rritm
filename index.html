
<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2/4 Musiqa Vaqti - Ali Bilan</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #a8edda 0%, #fed6e3 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .game-container {
            background: rgba(255, 255, 255, 0.95);
            padding: 30px;
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.15);
            max-width: 700px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            text-align: center;
        }

        h1 {
            color: #2c3e50;
            font-size: 26px;
        }

        /* Video yuqorida */
        .video-box {
            width: 100%;
            max-width: 500px;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            background: #000;
        }

        video {
            width: 100%;
            display: block;
        }

        /* Interaktiv qism pastda */
        .interactive-area {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .measure-container {
            display: flex;
            gap: 15px;
            background: #f8f9fa;
            padding: 15px 25px;
            border-radius: 16px;
            border: 3px dashed #bdc3c7;
        }

        .slot {
            width: 90px;
            height: 90px;
            border: 2px dashed #3498db;
            border-radius: 12px;
            background: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.3s ease;
        }

        .slot.hovered {
            background: #e8f4f8;
            border-color: #2ecc71;
            transform: scale(1.05);
        }

        .slot img {
            max-width: 80%;
            max-height: 80%;
            object-fit: contain;
        }

        .notes-palette {
            display: flex;
            gap: 15px;
            justify-content: center;
            padding: 15px;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            flex-wrap: wrap;
        }

        .note {
            width: 70px;
            height: 70px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            cursor: grab;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #fff;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .note:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .note img {
            max-width: 80%;
            max-height: 80%;
            object-fit: contain;
            pointer-events: none;
        }

        .btn-check {
            background: linear-gradient(135deg, #2ecc71 0%, #27ae60 100%);
            color: white;
            border: none;
            padding: 14px 36px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(46, 204, 113, 0.3);
            transition: all 0.3s ease;
        }

        .btn-check:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(46, 204, 113, 0.4);
        }
    </style>
</head>
<body>

<div class="game-container">
    <h1>🎶 2/4 Musiqa Vaqti - Ali Bilan</h1>

    <!-- Video yuqorida -->
    <div class="video-box">
        <video id="aliVideo" autoplay playsinline controls>
            <source src="v1.mp4" type="video/mp4">
        </video>
    </div>

    <!-- Interaktiv qism va tugmalar pastda -->
    <div class="interactive-area">
        <div class="measure-container">
            <div class="slot" ondrop="drop(event)" ondragover="allowDrop(event)" id="slot1"></div>
            <div class="slot" ondrop="drop(event)" ondragover="allowDrop(event)" id="slot2"></div>
        </div>

        <div class="notes-palette">
            <div class="note" draggable="true" ondragstart="drag(event)" id="n_quarter">
                <img src="quarter.png" id="img_quarter" data-type="correct">
            </div>
            <div class="note" draggable="true" ondragstart="drag(event)" id="n_eighths">
                <img src="eighths.png" id="img_eighths" data-type="correct">
            </div>
            <div class="note" draggable="true" ondragstart="drag(event)" id="n_clef">
                <img src="clef.png" id="img_clef" data-type="wrong">
            </div>
            <div class="note" draggable="true" ondragstart="drag(event)" id="n_single">
                <img src="eighth_single.png" id="img_single" data-type="wrong">
            </div>
        </div>

        <button class="btn-check" onclick="checkAnswer()">Tekshirish</button>
    </div>
</div>

<script>
    const aliVideo = document.getElementById('aliVideo');

    function allowDrop(ev) {
        ev.preventDefault();
        ev.currentTarget.classList.add('hovered');
    }

    function drag(ev) {
        let targetImg = ev.target.querySelector('img') || ev.target;
        ev.dataTransfer.setData("imgSrc", targetImg.src);
        ev.dataTransfer.setData("dataType", targetImg.getAttribute('data-type'));
    }

    function drop(ev) {
        ev.preventDefault();
        ev.currentTarget.classList.remove('hovered');
        
        let imgSrc = ev.dataTransfer.getData("imgSrc");
        let dataType = ev.dataTransfer.getData("dataType");

        ev.currentTarget.innerHTML = `<img src="${imgSrc}" data-type="${dataType}">`;
    }

    function checkAnswer() {
        const img1 = document.getElementById('slot1').querySelector('img');
        const img2 = document.getElementById('slot2').querySelector('img');

        if (!img1 || !img2) {
            aliVideo.src = 'v3.mp4';
            aliVideo.play();
            return;
        }

        const type1 = img1.getAttribute('data-type');
        const type2 = img2.getAttribute('data-type');

        if (type1 === 'correct' && type2 === 'correct') {
            aliVideo.src = 'v2.mp4';
            aliVideo.play();
        } else {
            aliVideo.src = 'v3.mp4';
            aliVideo.play();
        }
    }
</script>

</body>
</html>
